
{% extends "layout.html" %}
{% block content %}
<h1>Library Book Inventory</h1>
<a href="{{ url_for('add_book') }}" class="btn btn-primary">Add New Book</a>
<table class="table mt-3">
    <thead>
        <tr>
            <th>Title</th>
            <th>Author</th>
            <th>Year</th>
            <th>Genre</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {% for book in books %}
        <tr>
            <td>{{ book['title'] }}</td>
            <td>{{ book['author'] }}</td>
            <td>{{ book['year'] }}</td>
            <td>{{ book['genre'] }}</td>
            <td>
                <a href="{{ url_for('update_book', book_id=book['_id']) }}" class="btn btn-warning">Edit</a>
                <form action="{{ url_for('delete_book', book_id=book['_id']) }}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-danger">Delete</button>
                </form>
            </td>
        </tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
